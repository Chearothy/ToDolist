<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:30px 15px;background:#f3f5f7;color:#202124;font-family:Arial,sans-serif}
  main{max-width:700px;margin:auto;padding:24px;background:white;border-radius:14px}
  form{display:grid;gap:10px;margin:20px 0}
  input,button{padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px}
  #task{width:100%}
  .time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:block;margin-bottom:5px;font-size:14px}
  .time-row input{width:100%}
  button{cursor:pointer}
  .green{width:100%;background:#16834a;color:white;border:0}
  ul{list-style:none;padding:0;display:grid;gap:8px}
  li{display:flex;align-items:center;gap:10px;padding:12px;background:#f7f8f9;border-radius:8px}
  .check{appearance:none;-webkit-appearance:none;display:grid;place-items:center;width:27px;height:27px;flex:none;padding:0;margin:0;border:2px solid #aaa;border-radius:50%;background:white;cursor:pointer}
  .check:checked{background:#08c400;border-color:#08c400}
  .check:checked::after{content:"✓";color:white;font:bold 17px/1 Arial,sans-serif}
  .info{flex:1;overflow-wrap:anywhere}
  .times{display:block;margin-top:5px;color:#606770;font-size:13px}
  .done .task-name{color:#777;text-decoration:line-through}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .calendar-button{background:#e8f3ff;color:#135ca7;border:0}
  .delete{background:#feecec;color:#b42318;border:0}
  #status{font-size:13px;color:#606770}
  @media(max-width:560px){.time-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>My To-Do List</h1>

  <button id="enable" class="green" type="button">Enable notifications</button>
  <p id="status">Keep this page open for browser reminders.</p>

  <form id="form">
    <input id="task" placeholder="What do you need to do?" required>

    <div class="time-row">
      <div>
        <label for="start">Start date/time</label>
        <input id="start" type="datetime-local" required>
      </div>
      <div>
        <label for="deadline">Deadline</label>
        <input id="deadline" type="datetime-local" required>
      </div>
    </div>

    <button class="green" type="submit">Add</button>
  </form>

  <p id="empty">No tasks yet. Add one above.</p>
  <ul id="list"></ul>
</main>

<script>
  const $ = selector => document.querySelector(selector);
  const form = $("#form");
  let tasks = [];

  try {
    tasks = JSON.parse(localStorage.getItem("todoTasks")) || [];
  } catch {
    tasks = [];
  }

  function save() {
    localStorage.setItem("todoTasks", JSON.stringify(tasks));
  }

  function toLocalInputValue(date) {
    return new Date(date.getTime() - date.getTimezoneOffset() * 60000)
      .toISOString()
      .slice(0, 16);
  }

  function setDefaultTimes() {
    const now = new Date();
    $("#start").value = toLocalInputValue(now);
    $("#deadline").value = toLocalInputValue(
      new Date(now.getTime() + 24 * 60 * 60 * 1000)
    );
  }

  function shortDate(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime())
      ? "Not set"
      : date.toLocaleString([], {dateStyle:"short", timeStyle:"short"});
  }

  function escapeICS(text) {
    return String(text)
      .replace(/\\/g, "\\\\")
      .replace(/\r?\n/g, "\\n")
      .replace(/,/g, "\\,")
      .replace(/;/g, "\\;");
  }

  function icsDate(value) {
    return new Date(value).toISOString()
      .replace(/[-:]/g, "")
      .replace(/\.\d{3}Z$/, "Z");
  }

  function addToCalendar(task) {
    const ics = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//RothyListToDo//EN",
      "CALSCALE:GREGORIAN",
      "BEGIN:VEVENT",
      `UID:${task.id}@rothylisttodo.local`,
      `DTSTAMP:${icsDate(new Date())}`,
      `DTSTART:${icsDate(task.startAt)}`,
      `DTEND:${icsDate(task.deadlineAt)}`,
      `SUMMARY:${escapeICS(task.text)}`,
      "END:VEVENT",
      "END:VCALENDAR"
    ].join("\r\n");

    const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const filename = task.text.replace(/[\\/:*?"<>|]/g, "-").slice(0, 50) || "todo-task";

    link.href = url;
    link.download = `${filename}.ics`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function render() {
    $("#list").replaceChildren();
    $("#empty").hidden = tasks.length > 0;

    [...tasks]
      .sort((a, b) => Number(!!a.completed) - Number(!!b.completed))
      .forEach(task => {
        const li = document.createElement("li");
        li.className = task.completed ? "done" : "";

        const check = document.createElement("input");
        check.type = "checkbox";
        check.className = "check";
        check.checked = !!task.completed;
        check.onchange = () => {
          task.completed = check.checked;
          save();
          render();
        };

        const info = document.createElement("div");
        info.className = "info";

        const name = document.createElement("span");
        name.className = "task-name";
        name.textContent = task.text;

        const times = document.createElement("small");
        times.className = "times";
        times.textContent =
          `Start: ${shortDate(task.startAt)} · Deadline: ${shortDate(task.deadlineAt)}`;

        info.append(name, times);

        const actions = document.createElement("div");
        actions.className = "actions";

        const calendar = document.createElement("button");
        calendar.type = "button";
        calendar.className = "calendar-button";
        calendar.textContent = "Add to Calendar";
        calendar.onclick = () => addToCalendar(task);

        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete";
        del.textContent = "Delete";
        del.onclick = () => {
          tasks = tasks.filter(item => item.id !== task.id);
          save();
          render();
        };

        actions.append(calendar, del);
        li.append(check, info, actions);
        $("#list").append(li);
      });
  }

  form.onsubmit = event => {
    event.preventDefault();

    const startAt = new Date($("#start").value);
    const deadlineAt = new Date($("#deadline").value);

    if (deadlineAt < startAt) {
      $("#deadline").setCustomValidity("Deadline must be after the start time.");
      $("#deadline").reportValidity();
      return;
    }

    $("#deadline").setCustomValidity("");
    tasks.push({
      id: Date.now() + Math.random(),
      text: $("#task").value.trim(),
      startAt: startAt.toISOString(),
      deadlineAt: deadlineAt.toISOString(),
      completed: false,
      startNotified: false,
      deadlineNotified: false
    });

    save();
    render();
    form.reset();
    setDefaultTimes();
  };

  $("#deadline").oninput = () => $("#deadline").setCustomValidity("");

  $("#enable").onclick = async () => {
    if (!("Notification" in window)) {
      $("#status").textContent = "Notifications are not supported in this browser.";
      return;
    }

    try {
      const permission = await Notification.requestPermission();
      $("#status").textContent = permission === "granted"
        ? "Notifications enabled. Keep this page open."
        : "Please allow notifications in your browser settings.";
      checkReminders();
    } catch {
      $("#status").textContent = "Could not enable notifications.";
    }
  };

  function checkReminders() {
    if (!("Notification" in window) || Notification.permission !== "granted") return;

    let changed = false;

    tasks.forEach(task => {
      if (task.completed) return;

      [
        ["startAt", "startNotified", "Time to start your task"],
        ["deadlineAt", "deadlineNotified", "Task deadline reached"]
      ].forEach(([dateKey, notifiedKey, title]) => {
        const time = Date.parse(task[dateKey]);

        if (!task[notifiedKey] && Number.isFinite(time) && time <= Date.now()) {
          try {
            new Notification(title, {body:task.text});
            task[notifiedKey] = true;
            changed = true;
          } catch {}
        }
      });
    });

    if (changed) save();
  }

  setDefaultTimes();
  setInterval(checkReminders, 15000);
  render();
  checkReminders();
</script>
</body>
</html>
