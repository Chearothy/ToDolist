<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #fff;
      --text: #202637;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #16a085;
      --accent-dark: #11806b;
      --danger: #c0392b;
      --shadow: 0 8px 24px rgba(31, 41, 55, .07);
    }

    body.dark {
      color-scheme: dark;
      --bg: #151923;
      --surface: #202633;
      --text: #f3f4f6;
      --muted: #aab1bd;
      --border: #394150;
      --accent: #34c9a5;
      --accent-dark: #25a889;
      --danger: #ff8177;
      --shadow: 0 8px 24px rgba(0, 0, 0, .2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
    }

    button:hover { background: var(--accent-dark); }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: var(--bg); }
    button.danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
    button.small { padding: 6px 10px; font-size: 14px; }

    .page { max-width: 920px; margin: 0 auto; padding: 28px 18px 56px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); }
    h2 { margin: 0; font-size: 21px; }
    p { margin: 6px 0 0; }
    .muted { color: var(--muted); font-size: 14px; }
    .header-actions, .button-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 16px 0;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    label { color: var(--muted); font-size: 14px; font-weight: 600; }
    input {
      width: 100%;
      padding: 11px 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .section-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .task-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .task input[type="checkbox"] { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); }
    .task-content { flex: 1; min-width: 0; }
    .task-title { overflow-wrap: anywhere; font-weight: 650; }
    .task.completed .task-title { color: var(--muted); text-decoration: line-through; }
    .task-meta { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .empty { padding: 16px 4px; color: var(--muted); }
    .calendar-panel[hidden] { display: none; }
    footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }

    @media (max-width: 620px) {
      .page { padding: 20px 12px 40px; }
      header { align-items: flex-start; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>My To-Do List</h1>
        <p class="muted">Keep track of what you need to do.</p>
      </div>
      <div class="header-actions">
        <button id="weekButton" class="secondary" type="button">This Week</button>
        <button id="settingsButton" class="secondary" type="button" aria-label="Toggle dark mode">Settings</button>
      </div>
    </header>

    <section class="card">
      <h2>Add a task</h2>
      <form id="taskForm">
        <div class="form-grid">
          <div class="field full">
            <label for="taskTitle">Task</label>
            <input id="taskTitle" name="taskTitle" type="text" placeholder="What do you need to do?" required />
          </div>
          <div class="field">
            <label for="startAt">Start date/time</label>
            <input id="startAt" name="startAt" type="datetime-local" />
          </div>
          <div class="field">
            <label for="deadline">Deadline</label>
            <input id="deadline" name="deadline" type="datetime-local" />
          </div>
        </div>
        <div class="button-row">
          <button type="submit">Add Task</button>
          <button id="calendarButton" class="secondary" type="button">Add Calendar</button>
          <button id="copyButton" class="secondary" type="button">Copy records</button>
          <button id="downloadButton" class="secondary" type="button">Download CSV</button>
        </div>
      </form>
    </section>

    <section id="calendarPanel" class="card calendar-panel" hidden>
      <div class="section-heading">
        <div>
          <h2>Calendar</h2>
          <p class="muted">Tasks with dates are listed below.</p>
        </div>
        <button id="closeCalendarButton" class="secondary small" type="button">Close</button>
      </div>
      <ul id="calendarList" class="task-list"></ul>
    </section>

    <section class="card">
      <div class="section-heading">
        <div>
          <h2>All tasks</h2>
          <p class="muted">Completed tasks stay here until you clear them.</p>
        </div>
        <button id="clearDoneButton" class="danger small" type="button">Clear all done</button>
      </div>
      <ul id="allTasksList" class="task-list"></ul>
    </section>

    <section id="weekSection" class="card">
      <div class="section-heading">
        <div>
          <h2>This Week</h2>
          <p class="muted">All unfinished tasks, including tasks without deadlines.</p>
        </div>
      </div>
      <ul id="weekTasksList" class="task-list"></ul>
    </section>

    <footer>Tasks are saved in this browser.</footer>
  </main>

  <script>
    const STORAGE_KEY = "todo-app-tasks-v1";
    const THEME_KEY = "todo-app-dark-mode";

    const form = document.getElementById("taskForm");
    const titleInput = document.getElementById("taskTitle");
    const startInput = document.getElementById("startAt");
    const deadlineInput = document.getElementById("deadline");
    const allTasksList = document.getElementById("allTasksList");
    const weekTasksList = document.getElementById("weekTasksList");
    const calendarList = document.getElementById("calendarList");
    const calendarPanel = document.getElementById("calendarPanel");

    let tasks = loadTasks();

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString([], {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function dateSortValue(task) {
      const value = task.deadline || task.startAt;
      return value ? new Date(value).getTime() : Number.MAX_SAFE_INTEGER;
    }

    function makeTaskElement(task) {
      const item = document.createElement("li");
      item.className = "task" + (task.completed ? " completed" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = Boolean(task.completed);
      checkbox.setAttribute("aria-label", "Mark task complete");
      checkbox.addEventListener("change", () => {
        task.completed = checkbox.checked;
        saveTasks();
        render();
      });

      const content = document.createElement("div");
      content.className = "task-content";

      const title = document.createElement("div");
      title.className = "task-title";
      title.textContent = task.title;

      const meta = document.createElement("div");
      meta.className = "task-meta";
      const details = [];
      if (task.startAt) details.push("Starts: " + formatDate(task.startAt));
      if (task.deadline) details.push("Deadline: " + formatDate(task.deadline));
      meta.textContent = details.join(" · ") || "No date set";

      content.append(title, meta);

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "danger small";
      deleteButton.textContent = "Delete";
      deleteButton.setAttribute("aria-label", "Delete " + task.title);
      deleteButton.addEventListener("click", () => {
        tasks = tasks.filter(item => item.id !== task.id);
        saveTasks();
        render();
      });

      item.append(checkbox, content, deleteButton);
      return item;
    }

    function showEmpty(list, message) {
      const item = document.createElement("li");
      item.className = "empty";
      item.textContent = message;
      list.appendChild(item);
    }

    function render() {
      allTasksList.replaceChildren();
      weekTasksList.replaceChildren();
      calendarList.replaceChildren();

      const sortedTasks = [...tasks].sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        return dateSortValue(a) - dateSortValue(b);
      });

      if (sortedTasks.length) {
        sortedTasks.forEach(task => allTasksList.appendChild(makeTaskElement(task)));
      } else {
        showEmpty(allTasksList, "No tasks yet. Add one above.");
      }

      // This Week intentionally includes ALL pending tasks.
      // It does not filter by start date or deadline.
      const pendingTasks = sortedTasks.filter(task => !task.completed);

      if (pendingTasks.length) {
        pendingTasks.forEach(task => weekTasksList.appendChild(makeTaskElement(task)));
      } else {
        showEmpty(weekTasksList, "No pending tasks. Add one above.");
      }

      const datedTasks = sortedTasks.filter(task => task.startAt || task.deadline);
      if (datedTasks.length) {
        datedTasks.forEach(task => calendarList.appendChild(makeTaskElement(task)));
      } else {
        showEmpty(calendarList, "No tasks with dates yet.");
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const title = titleInput.value.trim();
      if (!title) {
        titleInput.focus();
        return;
      }

      tasks.push({
        id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())),
        title,
        startAt: startInput.value,
        deadline: deadlineInput.value,
        completed: false,
        createdAt: new Date().toISOString()
      });

      saveTasks();
      form.reset();
      titleInput.focus();
      render();
    });

    document.getElementById("weekButton").addEventListener("click", () => {
      document.getElementById("weekSection").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });

    document.getElementById("calendarButton").addEventListener("click", () => {
      calendarPanel.hidden = !calendarPanel.hidden;
      if (!calendarPanel.hidden) {
        calendarPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });

    document.getElementById("closeCalendarButton").addEventListener("click", () => {
      calendarPanel.hidden = true;
    });

    document.getElementById("clearDoneButton").addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      render();
    });

    document.getElementById("copyButton").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(JSON.stringify(tasks, null, 2));
        alert("Task records copied.");
      } catch {
        alert("Clipboard access was blocked. Try downloading the CSV instead.");
      }
    });

    function csvCell(value) {
      return '"' + String(value ?? "").replaceAll('"', '""') + '"';
    }

    document.getElementById("downloadButton").addEventListener("click", () => {
      const rows = [
        ["Task", "Start date/time", "Deadline", "Completed"],
        ...tasks.map(task => [
          task.title,
          task.startAt || "",
          task.deadline || "",
          task.completed ? "Yes" : "No"
        ])
      ];

      const csv = rows.map(row => row.map(csvCell).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "tasks.csv";
      link.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("settingsButton").addEventListener("click", () => {
      document.body.classList.toggle("dark");
      localStorage.setItem(
        THEME_KEY,
        document.body.classList.contains("dark") ? "true" : "false"
      );
    });

    if (localStorage.getItem(THEME_KEY) === "true") {
      document.body.classList.add("dark");
    }

    render();
  </script>
</body>
</html>
