<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List</title>

<style>
  *{box-sizing:border-box}
  body{margin:0;padding:clamp(16px,4vw,40px);background:#f3f5f7;color:#202124;font-family:Arial,sans-serif}
  main{max-width:680px;margin:auto;padding:clamp(18px,4vw,28px);background:white;border-radius:16px;box-shadow:0 8px 24px #00000012}
  h1{margin:0 0 20px;font-size:clamp(24px,6vw,32px)}
  form{display:grid;gap:12px;margin:20px 0}
  input,button{width:100%;padding:12px;border:1px solid #c9cdd2;border-radius:9px;font:inherit}
  label{display:block;margin-bottom:6px;font-size:14px}
  .time-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  button{border:0;cursor:pointer}
  .add-button{background:#16834a;color:white;font-weight:bold}
  .add-button:hover{background:#116b3c}
  ul{display:grid;gap:10px;margin:0;padding:0;list-style:none}
  li{display:flex;align-items:center;gap:12px;padding:12px;background:#f7f8f9;border-radius:10px}
  .check{appearance:none;-webkit-appearance:none;display:grid;place-items:center;flex:none;width:28px;height:28px;margin:0;padding:0;border:2px solid #aeb4b9;border-radius:50%;background:white;cursor:pointer}
  .check:checked{border-color:#08a330;background:#08a330}
  .check:checked::after{content:"✓";color:white;font:bold 17px/1 Arial,sans-serif}
  .task-name{flex:1;overflow-wrap:anywhere}
  .done .task-name{color:#777;text-decoration:line-through}
  .delete-button{width:auto;padding:9px 12px;background:#feecec;color:#b42318}
  #empty{color:#6b7280;text-align:center}

  @media(max-width:520px){
    main{border-radius:12px}
    .time-row{grid-template-columns:1fr}
    li{align-items:flex-start}
    .delete-button{padding:8px 10px}
  }
</style>
</head>

<body>
<main>
  <h1>My To-Do List</h1>

  <form id="form">
    <input id="task" placeholder="What do you need to do?" required>

    <div class="time-row">
      <div>
        <label for="start">Start date/time</label>
        <input id="start" type="datetime-local" required>
      </div>
      <div>
        <label for="deadline">Deadline</label>
        <input id="deadline" type="datetime-local" required>
      </div>
    </div>

    <button class="add-button" type="submit">Add & Open Calendar</button>
  </form>

  <p id="empty">No tasks yet. Add one above.</p>
  <ul id="list"></ul>
</main>

<script>
  const $ = selector => document.querySelector(selector);
  const form = $("#form");
  let tasks = [];

  try {
    tasks = JSON.parse(localStorage.getItem("todoTasks")) || [];
  } catch {
    tasks = [];
  }

  function save() {
    localStorage.setItem("todoTasks", JSON.stringify(tasks));
  }

  function localDateTime(date) {
    return new Date(date.getTime() - date.getTimezoneOffset() * 60000)
      .toISOString().slice(0, 16);
  }

 function setDefaultTimes() {
  const now = new Date();

  $("#start").value = localDateTime(
    new Date(now.getTime() + 30 * 60 * 1000)
  );

  $("#deadline").value = localDateTime(
    new Date(now.getTime() + 24 * 60 * 60 * 1000)
  );
}

  function calendarDate(value) {
    return new Date(value).toISOString()
      .replace(/[-:]/g, "")
      .replace(/\.\d{3}Z$/, "Z");
  }

  function openGoogleCalendar(task) {
    const params = new URLSearchParams({
      action: "TEMPLATE",
      text: task.text,
      dates: `${calendarDate(task.startAt)}/${calendarDate(task.deadlineAt)}`
    });

    const url = `https://calendar.google.com/calendar/render?${params}`;
    const tab = window.open(url, "_blank");

    if (!tab) window.location.href = url;
  }

  function render() {
    $("#list").replaceChildren();
    $("#empty").hidden = tasks.length > 0;

    [...tasks]
      .sort((a, b) => Number(!!a.completed) - Number(!!b.completed))
      .forEach(task => {
        const item = document.createElement("li");

        const check = document.createElement("input");
        check.type = "checkbox";
        check.className = "check";
        check.checked = !!task.completed;
        check.setAttribute("aria-label", `Mark ${task.text} complete`);
        check.onchange = () => {
          task.completed = check.checked;
          save();
          render();
        };

        const name = document.createElement("span");
        name.className = "task-name";
        name.textContent = task.text;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete-button";
        remove.textContent = "Delete";
        remove.onclick = () => {
          tasks = tasks.filter(saved => saved.id !== task.id);
          save();
          render();
        };

        item.className = task.completed ? "done" : "";
        item.append(check, name, remove);
        $("#list").append(item);
      });
  }

  form.onsubmit = event => {
    event.preventDefault();

    const startAt = new Date($("#start").value);
    const deadlineAt = new Date($("#deadline").value);

    if (deadlineAt < startAt) {
      $("#deadline").setCustomValidity("Deadline must be after the start time.");
      $("#deadline").reportValidity();
      return;
    }

    $("#deadline").setCustomValidity("");

    const task = {
      id: Date.now() + Math.random(),
      text: $("#task").value.trim(),
      startAt: startAt.toISOString(),
      deadlineAt: deadlineAt.toISOString(),
      completed: false
    };

    tasks.push(task);
    save();
    render();
    openGoogleCalendar(task);

    form.reset();
    setDefaultTimes();
  };

  $("#deadline").oninput = () => $("#deadline").setCustomValidity("");

  setDefaultTimes();
  render();
</script>
</body>
</html>
