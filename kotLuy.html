<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Money Tracker</title>

  <style>
    :root {
      --green: #17845d;
      --green-light: #e9f5ef;
      --red: #c84c4c;
      --ink: #202822;
      --muted: #778078;
      --line: #e8ece8;
      --surface: #ffffff;
      --background: #f5f7f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font-family: Arial, "Noto Sans Khmer", "Khmer OS System", sans-serif;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 { margin: 0 0 5px; font-size: 28px; }
    h2 { margin: 0 0 18px; font-size: 18px; }
    p { margin-top: 0; }

    .subtitle, .muted { color: var(--muted); }
    .subtitle { margin-bottom: 0; }

    button, input, select { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-actions select,
    .header-actions button {
      min-height: 42px;
    }

    .settings-button {
      background: white;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .language-button,
    .export-button {
      background: var(--green-light);
      color: var(--green);
    }

    .preferences {
      display: flex;
      align-items: end;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .preferences[hidden] { display: none; }
    .preferences .field { margin: 0; }
    .preferences .rate-field { width: 230px; }

    .rate-hint {
      color: var(--muted);
      font-size: 13px;
      padding-bottom: 11px;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .card, .summary-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(27, 48, 34, 0.035);
    }

    .card { padding: 22px; }
    .entry-card { position: sticky; top: 20px; }
    .main-content { min-width: 0; }

    .field { margin-bottom: 15px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      border: 1px solid #dce3dc;
      border-radius: 9px;
      padding: 11px 12px;
      background: white;
      color: var(--ink);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(23, 132, 93, 0.1);
    }

    .amount-entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 90px;
      gap: 8px;
    }

    .suggestion-label { margin-top: 11px; }

    .submit-button {
      width: 100%;
      margin-top: 3px;
      background: var(--green);
      color: white;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .summary-card { padding: 18px; }

    .summary-label {
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .summary-value {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .income { color: var(--green); }
    .expense { color: var(--red); }
    .section-card { margin-bottom: 18px; }

    .category-row {
      display: grid;
      grid-template-columns: 105px minmax(30px, 1fr) 100px;
      gap: 12px;
      align-items: center;
      margin: 13px 0;
      font-size: 13px;
    }

    .bar-track {
      height: 9px;
      overflow: hidden;
      border-radius: 99px;
      background: #eef1ee;
    }

    .bar {
      height: 100%;
      border-radius: inherit;
      background: var(--green);
    }

    .category-amount {
      text-align: right;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .toolbar input { flex: 1; }
    .toolbar select { width: 150px; }
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th, td {
      padding: 13px 8px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-size: 12px;
    }

    td:first-child, th:first-child { padding-left: 0; }
    td:last-child, th:last-child { padding-right: 0; text-align: right; }

    .delete-button {
      padding: 6px 9px;
      background: transparent;
      color: var(--muted);
    }

    .delete-button:hover { color: var(--red); }

    .empty-state {
      padding: 24px 0;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .entry-card { position: static; }
    }

    @media (max-width: 600px) {
      .app { padding: 22px 14px; }
      header { align-items: flex-start; flex-wrap: wrap; }
      h1 { font-size: 23px; }
      .header-actions { width: 100%; }
      .header-actions > * { flex: 1; }

      .preferences { align-items: stretch; }
      .preferences .rate-field { width: 100%; }
      .rate-hint { padding: 0; }

      .summary { grid-template-columns: 1fr; }

      .summary-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .summary-label { margin: 0; }
      .summary-value { font-size: 20px; }
      .card { padding: 18px; }
      .toolbar { flex-direction: column; }
      .toolbar select { width: 100%; }

      .category-row {
        grid-template-columns: 82px minmax(30px, 1fr) 85px;
        gap: 8px;
      }

      .table-wrap { overflow: visible; }
      table, tbody { display: block; }
      thead { display: none; }
      tbody { display: grid; gap: 10px; }

      tbody tr {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      tbody td {
        min-width: 0;
        padding: 0;
        border: 0;
        white-space: normal;
      }

      tbody td:nth-child(1) {
        grid-column: 1;
        grid-row: 1;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      tbody td:nth-child(2) {
        grid-column: 1;
        grid-row: 2;
        color: var(--muted);
        font-size: 13px;
      }

      tbody td:nth-child(2)::before {
        content: attr(data-label);
        font-weight: 700;
      }

      tbody td:nth-child(3) {
        grid-column: 1;
        grid-row: 3;
        color: var(--muted);
        font-size: 12px;
      }

      tbody td:nth-child(3)::before {
        content: attr(data-label);
        font-weight: 700;
      }

      tbody td:nth-child(4) {
        grid-column: 2;
        grid-row: 1;
        text-align: right;
        white-space: nowrap;
        font-weight: 700;
      }

      tbody td:nth-child(5) {
        grid-column: 2;
        grid-row: 2 / span 2;
        align-self: center;
        text-align: right;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1 data-i18n="title">My Money Tracker</h1>
        <p class="subtitle" data-i18n="subtitle">Track your income and spending.</p>
      </div>

      <div class="header-actions">
        <button id="settingsButton" class="settings-button" type="button"
                aria-expanded="false" data-i18n="settings">Settings</button>
        <button class="language-button" id="languageButton" type="button">ខ្មែរ</button>

        <select id="currencySelect" aria-label="Display currency">
          <option value="USD">US dollar (USD)</option>
          <option value="KHR">Cambodian riel (KHR)</option>
        </select>

        <button class="export-button" id="exportButton" type="button" data-i18n="export">
          Export CSV
        </button>
      </div>
    </header>

    <div class="preferences" id="settingsPanel" hidden>
      <div class="field rate-field">
        <label for="exchangeRate" data-i18n="exchangeRate">
          Exchange rate (KHR per 1 USD)
        </label>
        <input id="exchangeRate" type="number" min="0.0001" step="0.01" value="4000" />
      </div>
      <div class="rate-hint" id="rateHint"></div>
    </div>

    <div class="layout">
      <aside class="card entry-card">
        <h2 data-i18n="addHeading">Add a transaction</h2>

        <form id="transactionForm">
          <div class="field">
            <label for="description" data-i18n="description">Description</label>
            <input id="description" type="text" maxlength="60"
                   list="descriptionSuggestions"
                   placeholder="e.g. Lunch or monthly salary"
                   data-i18n-placeholder="descriptionPlaceholder" required />
            <datalist id="descriptionSuggestions"></datalist>

            <label for="descriptionSuggestion" class="suggestion-label"
                   data-i18n="descriptionSuggestion">
              Quick suggestions (optional)
            </label>
            <select id="descriptionSuggestion">
              <option value="" data-i18n="chooseSuggestion">Choose a suggestion…</option>
            </select>
          </div>

          <div class="field">
            <label for="amount" data-i18n="amount">Amount</label>
            <div class="amount-entry">
              <input id="amount" type="number" min="0.01" step="0.01"
                     placeholder="0.00" required />
              <select id="entryCurrency" aria-label="Currency for this amount">
                <option value="USD">USD</option>
                <option value="KHR">KHR</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="type" data-i18n="type">Type</label>
            <select id="type">
              <option value="expense" data-i18n="expense">Expense</option>
              <option value="income" data-i18n="income">Income</option>
            </select>
          </div>

          <div class="field">
            <label for="category" data-i18n="category">Category</label>
            <select id="category"></select>
          </div>

          <div class="field">
            <label for="date" data-i18n="date">Date</label>
            <input id="date" type="date" required />
          </div>

          <button class="submit-button" type="submit" data-i18n="addButton">
            Add transaction
          </button>
        </form>
      </aside>

      <main class="main-content">
        <section class="summary" aria-label="Money summary">
          <div class="summary-card">
            <p class="summary-label" data-i18n="balance">Balance (all time)</p>
            <p class="summary-value" id="balance">$0.00</p>
          </div>

          <div class="summary-card">
            <p class="summary-label" data-i18n="monthlyIncome">Income this month</p>
            <p class="summary-value income" id="monthlyIncome">$0.00</p>
          </div>

          <div class="summary-card">
            <p class="summary-label" data-i18n="monthlyExpenses">Expenses this month</p>
            <p class="summary-value expense" id="monthlyExpenses">$0.00</p>
          </div>
        </section>

        <section class="card section-card">
          <h2 data-i18n="breakdownHeading">Spending by category this month</h2>
          <div id="categoryBreakdown"></div>
        </section>

        <section class="card">
          <h2 data-i18n="transactionsHeading">Transactions</h2>

          <div class="toolbar">
            <input id="search" type="search" placeholder="Search transactions"
                   data-i18n-placeholder="search" />
            <select id="typeFilter" aria-label="Filter by type">
              <option value="all" data-i18n="allTypes">All types</option>
              <option value="income" data-i18n="income">Income</option>
              <option value="expense" data-i18n="filterExpenses">Expenses</option>
            </select>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="description">Description</th>
                  <th data-i18n="category">Category</th>
                  <th data-i18n="date">Date</th>
                  <th data-i18n="amount">Amount</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="transactionRows"></tbody>
            </table>
          </div>

          <div class="empty-state" id="emptyState"></div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "my-money-tracker-transactions";
    const PREFS_KEY = "my-money-tracker-preferences";

    const CATEGORIES = {
      expense: ["Food", "Transport", "Bills", "Shopping", "Health", "Entertainment", "Other"],
      income: ["Salary", "Freelance", "Gift", "Investment", "Other"]

    const DESCRIPTION_SUGGESTIONS = {

        "ការដឹកជញ្ជូន", "ថ្លៃជួល", "ប្រាក់ខែ", "វិក្កយបត្រ"
      ]
    };

    const TEXT = {
      en: {
        title: "My Money Tracker",
        subtitle: "Track your income and spending.",
        settings: "Settings",
        export: "Export CSV",
        addHeading: "Add a transaction",

        descriptionPlaceholder: "e.g. Lunch or monthly salary",
        descriptionSuggestion: "Quick suggestions (optional)",
        chooseSuggestion: "Choose a suggestion…",
        amount: "Amount",
        type: "Type",
        expense: "Expense",
        income: "Income",
        category: "Category",
        date: "Date",
        addButton: "Add transaction",
        balance: "Balance (all time)",
        monthlyIncome: "Income this month",

        filterExpenses: "Expenses",
        empty: "No transactions yet. Add one to get started.",
        noMatch: "No matching transactions.",
        delete: "Delete",
        exchangeRate: "Exchange rate (KHR per 1 USD)",
        rateHint: "Example rate only — edit it to your preferred rate.",
        rateLine: "1 USD = {rate} KHR",
        catFood: "Food",

        catOther: "Other",
        catSalary: "Salary",
        catFreelance: "Freelance",
        catGift: "Gift",
        catInvestment: "Investment"
      },

      km: {
        title: "កម្មវិធីតាមដានប្រាក់របស់ខ្ញុំ",
        subtitle: "តាមដានប្រាក់ចំណូល និងការចំណាយរបស់អ្នក។",
        settings: "ការកំណត់",
        export: "នាំចេញ CSV",
        addHeading: "បន្ថែមប្រតិបត្តិការ",

        descriptionPlaceholder: "ឧ. អាហារថ្ងៃត្រង់ ឬប្រាក់ខែ",
        descriptionSuggestion: "ការណែនាំពិពណ៌នា (ជាជម្រើស)",
        chooseSuggestion: "ជ្រើសរើសការណែនាំ…",
        amount: "ចំនួនទឹកប្រាក់",

        addButton: "បន្ថែមប្រតិបត្តិការ",

        monthlyIncome: "ចំណូលខែនេះ",
        monthlyExpenses: "ចំណាយខែនេះ",
        breakdownHeading: "ចំណាយតាមប្រភេទក្នុងខែនេះ",
        noExpenses: "មិនទាន់មានការចំណាយក្នុងខែនេះទេ។",
        transactionsHeading: "ប្រតិបត្តិការ",
        search: "ស្វែងរកប្រតិបត្តិការ",
        allTypes: "គ្រប់ប្រភេទ",
        filterExpenses: "ចំណាយ",
        empty: "មិនទាន់មានប្រតិបត្តិការទេ។ បន្ថែមដើម្បីចាប់ផ្តើម។",
        noMatch: "រកមិនឃើញប្រតិបត្តិការដែលត្រូវគ្នាទេ។",
        delete: "លុប",
        exchangeRate: "អត្រាប្តូរប្រាក់ (រៀលក្នុង 1 ដុល្លារ)",
        rateHint: "នេះជាអត្រាគំរូប៉ុណ្ណោះ — អ្នកអាចកែតម្រូវបាន។",
        rateLine: "1 ដុល្លារ = {rate} រៀល",
        catFood: "អាហារ",
        catTransport: "ការដឹកជញ្ជូន",
        catBills: "វិក្កយបត្រ",
        catShopping: "ការទិញទំនិញ",
        catHealth: "សុខភាព",
        catEntertainment: "ការកម្សាន្ត",
        catOther: "ផ្សេងៗ",
        catSalary: "ប្រាក់ខែ",
        catFreelance: "ការងារឯករាជ្យ",
        catGift: "អំណោយ",
        catInvestment: "ការវិនិយោគ"
      }
    };

    const form = document.getElementById("transactionForm");
    const descriptionInput = document.getElementById("description");
    const descriptionSuggestionInput = document.getElementById("descriptionSuggestion");
    const amountInput = document.getElementById("amount");
    const typeInput = document.getElementById("type");
    const categoryInput = document.getElementById("category");
    const dateInput = document.getElementById("date");
    const entryCurrencyInput = document.getElementById("entryCurrency");
    const rows = document.getElementById("transactionRows");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("search");
    const typeFilter = document.getElementById("typeFilter");
    const currencySelect = document.getElementById("currencySelect");
    const exchangeRateInput = document.getElementById("exchangeRate");
    const settingsButton = document.getElementById("settingsButton");
    const settingsPanel = document.getElementById("settingsPanel");

    function readPreferences() {
      try {
        return JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
      } catch {
        return {};
      }
    }

    const savedPreferences = readPreferences();

    let language = savedPreferences.language === "km" ? "km" : "en";
    let displayCurrency = savedPreferences.currency === "KHR" ? "KHR" : "USD";
    let exchangeRate = Number(savedPreferences.exchangeRate) > 0
      ? Number(savedPreferences.exchangeRate)
      : 4000;

    function loadTransactions() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (!Array.isArray(saved)) return [];

        // Transactions from the first version were entered in USD.
        return saved.map((item) => ({
          ...item,
          currency: item.currency === "KHR" ? "KHR" : "USD"
        }));
      } catch {
        return [];
      }
    }

    let transactions = loadTransactions();

    function saveTransactions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    }

    function savePreferences() {
      localStorage.setItem(PREFS_KEY, JSON.stringify({
        language,
        currency: displayCurrency,
        exchangeRate
      }));
    }

    function t(key) {
      return TEXT[language][key] || TEXT.en[key] || key;
    }

    function categoryName(name) {
      return t("cat" + name) || name;
    }

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function convertAmount(amount, fromCurrency) {
      if (fromCurrency === displayCurrency) return amount;

      return fromCurrency === "USD"
        ? amount * exchangeRate
        : amount / exchangeRate;
    }

    function formatMoney(value) {
      return new Intl.NumberFormat(language === "km" ? "km-KH" : "en-US", {
        style: "currency",
        currency: displayCurrency,
        maximumFractionDigits: displayCurrency === "KHR" ? 0 : 2,
        minimumFractionDigits: displayCurrency === "KHR" ? 0 : 2
      }).format(value);
    }

    function formatDate(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);
      const locale = language === "km" ? "km-KH" : "en-US";
      return new Date(year, month - 1, day).toLocaleDateString(locale);
    }

    function currentMonthKey() {
      return localDateString().slice(0, 7);
    }

    function updateCategories() {
      categoryInput.replaceChildren();

      CATEGORIES[typeInput.value].forEach((name) => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = categoryName(name);
        categoryInput.appendChild(option);
      });
    }

    function updateDescriptionSuggestions() {
      const datalist = document.getElementById("descriptionSuggestions");
      datalist.replaceChildren();
      descriptionSuggestionInput.replaceChildren();

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = t("chooseSuggestion");
      descriptionSuggestionInput.appendChild(placeholder);

      DESCRIPTION_SUGGESTIONS[language].forEach((description) => {
        const datalistOption = document.createElement("option");
        datalistOption.value = description;
        datalist.appendChild(datalistOption);

        const selectOption = document.createElement("option");
        selectOption.value = description;
        selectOption.textContent = description;
        descriptionSuggestionInput.appendChild(selectOption);
      });
    }

    function applyLanguage() {
      document.documentElement.lang = language === "km" ? "km" : "en";

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = t(element.dataset.i18n);
      });

      document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
        element.placeholder = t(element.dataset.i18nPlaceholder);
      });

      document.getElementById("languageButton").textContent =
        language === "en" ? "ខ្មែរ" : "English";

      currencySelect.options[0].textContent =
        language === "en" ? "US dollar (USD)" : "ដុល្លារអាមេរិក (USD)";
      currencySelect.options[1].textContent =
        language === "en" ? "Cambodian riel (KHR)" : "រៀលកម្ពុជា (KHR)";

      entryCurrencyInput.setAttribute(
        "aria-label",
        language === "en" ? "Currency for this amount" : "រូបិយប័ណ្ណសម្រាប់ចំនួននេះ"
      );

      document.getElementById("rateHint").textContent =
        t("rateLine").replace("{rate}", exchangeRate.toLocaleString()) +
        " · " + t("rateHint");

      updateCategories();
      updateDescriptionSuggestions();
      render();
    }

    function makeCell(text, label = "") {
      const cell = document.createElement("td");
      cell.textContent = text;
      if (label) cell.dataset.label = label;
      return cell;
    }

    function renderSummary() {
      const month = currentMonthKey();

      const income = transactions
        .filter((item) => item.type === "income" && item.date.startsWith(month))
        .reduce((sum, item) =>
          sum + convertAmount(item.amount, item.currency), 0);

      const expenses = transactions
        .filter((item) => item.type === "expense" && item.date.startsWith(month))
        .reduce((sum, item) =>
          sum + convertAmount(item.amount, item.currency), 0);

      const balance = transactions.reduce((sum, item) => {
        const amount = convertAmount(item.amount, item.currency);
        return sum + (item.type === "income" ? amount : -amount);
      }, 0);

      document.getElementById("balance").textContent = formatMoney(balance);
      document.getElementById("monthlyIncome").textContent = formatMoney(income);
      document.getElementById("monthlyExpenses").textContent = formatMoney(expenses);
    }

    function renderCategories() {
      const container = document.getElementById("categoryBreakdown");
      container.replaceChildren();

      const month = currentMonthKey();
      const totals = {};

      transactions
        .filter((item) => item.type === "expense" && item.date.startsWith(month))
        .forEach((item) => {
          totals[item.category] = (totals[item.category] || 0) +
            convertAmount(item.amount, item.currency);
        });

      const categories = Object.entries(totals).sort((a, b) => b[1] - a[1]);

      if (categories.length === 0) {
        const message = document.createElement("p");
        message.className = "muted";
        message.textContent = t("noExpenses");
        container.appendChild(message);
        return;
      }

      const largest = categories[0][1];

      categories.forEach(([name, amount]) => {
        const line = document.createElement("div");
        line.className = "category-row";

        const label = document.createElement("span");
        label.textContent = categoryName(name);

        const track = document.createElement("div");
        track.className = "bar-track";

        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.width = `${Math.max(4, (amount / largest) * 100)}%`;
        track.appendChild(bar);

        const value = document.createElement("span");
        value.className = "category-amount";
        value.textContent = formatMoney(amount);

        line.append(label, track, value);
        container.appendChild(line);
      });
    }

    function renderTransactions() {
      rows.replaceChildren();

      const query = searchInput.value.trim().toLowerCase();
      const filter = typeFilter.value;

      const visible = [...transactions]
        .filter((item) => filter === "all" || item.type === filter)
        .filter((item) =>
          `${item.description} ${categoryName(item.category)}`
            .toLowerCase()
            .includes(query)
        )
        .sort((a, b) => b.date.localeCompare(a.date));

      visible.forEach((item) => {
        const row = document.createElement("tr");

        row.appendChild(makeCell(item.description));
        row.appendChild(makeCell(categoryName(item.category), t("category") + ": "));
        row.appendChild(makeCell(formatDate(item.date), t("date") + ": "));

        const amountCell = document.createElement("td");
        amountCell.className = item.type;
        const converted = convertAmount(item.amount, item.currency);
        amountCell.textContent =
          `${item.type === "income" ? "+" : "−"}${formatMoney(converted)}`;
        row.appendChild(amountCell);

        const actionCell = document.createElement("td");
        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = t("delete");
        deleteButton.setAttribute("aria-label", `${t("delete")} ${item.description}`);
        deleteButton.addEventListener("click", () => deleteTransaction(item.id));
        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);

        rows.appendChild(row);
      });

      emptyState.hidden = visible.length > 0;
      emptyState.textContent = transactions.length > 0 ? t("noMatch") : t("empty");
    }

    function render() {
      renderSummary();
      renderCategories();
      renderTransactions();
    }

    function deleteTransaction(id) {
      transactions = transactions.filter((item) => item.id !== id);
      saveTransactions();
      render();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const amount = Number(amountInput.value);
      if (!Number.isFinite(amount) || amount <= 0) return;

      transactions.push({
        id: `${Date.now()}-${Math.random()}`,
        description: descriptionInput.value.trim(),
        amount,
        currency: entryCurrencyInput.value,
        type: typeInput.value,
        category: categoryInput.value,
        date: dateInput.value
      });

      saveTransactions();
      form.reset();

      typeInput.value = "expense";
      entryCurrencyInput.value = displayCurrency;
      dateInput.value = localDateString();

      updateCategories();
      render();
      descriptionInput.focus();
    });

    settingsButton.addEventListener("click", () => {
      settingsPanel.hidden = !settingsPanel.hidden;
      settingsButton.setAttribute("aria-expanded", String(!settingsPanel.hidden));
    });

    descriptionSuggestionInput.addEventListener("change", () => {
      if (descriptionSuggestionInput.value) {
        descriptionInput.value = descriptionSuggestionInput.value;
        descriptionSuggestionInput.value = "";
      }
    });

    document.getElementById("languageButton").addEventListener("click", () => {
      language = language === "en" ? "km" : "en";
      savePreferences();
      applyLanguage();
    });

    currencySelect.addEventListener("change", () => {
      displayCurrency = currencySelect.value;
      savePreferences();
      applyLanguage();
    });

    exchangeRateInput.addEventListener("input", () => {
      const value = Number(exchangeRateInput.value);

      if (Number.isFinite(value) && value > 0) {
        exchangeRate = value;
        savePreferences();
        applyLanguage();
      }
    });

    typeInput.addEventListener("change", updateCategories);
    searchInput.addEventListener("input", renderTransactions);
    typeFilter.addEventListener("change", renderTransactions);

    document.getElementById("exportButton").addEventListener("click", () => {
      const header = [
        "Description",
        "Type",
        "Category",
        "Date",
        "Original Amount",
        "Original Currency",
        "Converted Amount",
        "Display Currency"
      ];

      const csvRows = transactions.map((item) => {
        const convertedAmount = convertAmount(item.amount, item.currency);
        const convertedText = convertedAmount.toFixed(
          displayCurrency === "KHR" ? 0 : 2
        );

        return [
          item.description,
          item.type,
          item.category,
          item.date,
          item.amount,
          item.currency,
          convertedText,
          displayCurrency
        ]
          .map((value) => `"${String(value).replaceAll('"', '""')}"`)
          .join(",");
      });

      const csv = "\uFEFF" + [header.join(","), ...csvRows].join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "money-tracker-transactions.csv";
      link.click();

      URL.revokeObjectURL(url);
    });

    currencySelect.value = displayCurrency;
    entryCurrencyInput.value = displayCurrency;
    exchangeRateInput.value = exchangeRate;
    dateInput.value = localDateString();

    applyLanguage();
  </script>
</body>
</html>
